<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>Today — Every day has a story</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#444;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh}main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:100px 24px 95px}.wrap{text-align:center;max-width:760px;width:100%;animation:rise .65s ease both}.eyebrow{color:#a0a0a0;font-size:12px;letter-spacing:.23em;text-transform:uppercase;font-weight:600}h1{font-size:clamp(52px,9vw,100px);letter-spacing:-.065em;line-height:1.08;font-weight:500;margin:17px 0 6px}.year{color:#aaa;font-size:17px}.line{height:1px;width:38px;background:#ddd;margin:39px auto 31px}.feature{font-size:clamp(23px,4vw,35px);font-weight:450;letter-spacing:-.035em;margin:17px auto 8px;line-height:1.2;max-width:680px}.meta{font-size:13px;color:#aaa;margin-top:12px}.actions{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:29px}button{font:inherit;border:1px solid #e8e8e8;border-radius:99px;background:#fff;color:#777;padding:11px 17px;cursor:pointer;transition:.2s}button:hover{background:#f6f6f6;color:#333}button:focus-visible{outline:2px solid #999;outline-offset:3px}.small{font-size:13px}.all{margin:32px auto 0;max-width:550px;text-align:left;border-top:1px solid #eee;padding-top:17px}.all[hidden]{display:none}.item{padding:13px 0;border-bottom:1px solid #f2f2f2;font-size:14px;color:#555}.item span{display:block;font-size:11px;color:#aaa;margin-top:5px}footer{position:fixed;bottom:23px;left:0;right:0;text-align:center;color:#bbb;font-size:11px;pointer-events:none}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){main{align-items:flex-start;padding-top:17vh}h1{letter-spacing:-.055em}.actions{gap:8px}button{padding:10px 13px}}
</style>
</head>
<body>
<main><div class="wrap"><div class="eyebrow" id="weekday">TODAY</div><h1 id="date">Loading…</h1><div class="year" id="year"></div><div class="line"></div><div class="eyebrow">TODAY WE CELEBRATE</div><div class="feature" id="feature">Finding something special</div><div class="meta" id="meta"></div><div class="actions"><button id="prev" aria-label="Previous day">←</button><button id="today" class="small">Today</button><button id="next" aria-label="Next day">→</button><button id="toggle" class="small" aria-expanded="false">View all ↓</button></div><div class="all" id="all" hidden></div></div></main><footer>Every day has a story. · <span id="total">Offline holiday collection</span></footer>
<script>
let holidays=[],selected=new Date(),showAll=false;
const el=id=>document.getElementById(id);
const key=d=>String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function rank(h){let n=h.name.toLowerCase(),c=h.category||'';let score=0;if(/^(world|international|national)\b/i.test(h.name))score+=5;if(c==='Secular/Cultural')score+=4;if(c==='UN/International')score+=3;if(/day\b/i.test(h.name))score+=1;if(/^(feast|st\.|saint|roman)/i.test(h.name))score-=8;if(/\(.*(movable|~|every \d|third|first|second|last).*\)/i.test(h.name))score-=5;return score}
function render(){const d=selected;el('weekday').textContent=d.toLocaleDateString('en-US',{weekday:'long'});el('date').textContent=d.toLocaleDateString('en-US',{month:'long',day:'numeric'});el('year').textContent=d.getFullYear();const items=holidays.filter(h=>h.date===key(d)).sort((a,b)=>rank(b)-rank(a));el('feature').textContent=items[0]?.name||'A day worth celebrating';el('meta').textContent=items.length?`${items.length} observance${items.length===1?'':'s'} on this date`: 'No observances listed';el('all').replaceChildren();items.forEach(h=>{let row=document.createElement('div');row.className='item';row.textContent=h.name;let detail=document.createElement('span');detail.textContent=[h.category,h.country].filter(Boolean).join(' · ');row.append(detail);el('all').append(row)});el('all').hidden=!showAll;el('toggle').textContent=showAll?'Hide all ↑':'View all ↓';el('toggle').setAttribute('aria-expanded',String(showAll))}
function move(n){selected.setDate(selected.getDate()+n);render()}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('today').onclick=()=>{selected=new Date();render()};el('toggle').onclick=()=>{showAll=!showAll;render()};
fetch('./holidays.json').then(r=>{if(!r.ok)throw Error('File not found');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid data');holidays=data;el('total').textContent=`${data.length.toLocaleString('en-US')} observances preloaded`;render()}).catch(()=>{el('feature').textContent='Could not load holidays.json';el('meta').textContent='Place holidays.json next to index.html and open via GitHub Pages or a local server.';render()});
setInterval(()=>{if(key(selected)===key(new Date())){selected=new Date();render()}},60000);
render();
</script>
</body></html>
