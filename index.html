<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>WhatDay</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#444;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh}main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:60px 24px}.wrap{text-align:center;max-width:760px;width:100%;animation:rise .65s ease both}.eyebrow{color:#a0a0a0;font-size:12px;letter-spacing:.23em;text-transform:uppercase;font-weight:600}h1{font-size:clamp(52px,9vw,100px);letter-spacing:-.065em;line-height:1.08;font-weight:500;margin:17px 0 6px}.year{color:#aaa;font-size:17px}.line{height:1px;width:38px;background:#ddd;margin:39px auto 31px}.feature{font-size:clamp(23px,4vw,35px);font-weight:450;letter-spacing:-.035em;margin:17px auto 8px;line-height:1.2;max-width:680px}.meta{font-size:13px;color:#aaa;margin-top:12px}.actions{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:29px}button{font:inherit;border:1px solid #e8e8e8;border-radius:99px;background:#fff;color:#777;padding:11px 17px;cursor:pointer;transition:.2s}button:hover{background:#f6f6f6;color:#333}button:focus-visible{outline:2px solid #999;outline-offset:3px}.small{font-size:13px}.all{margin:32px auto 0;max-width:550px;text-align:left;border-top:1px solid #eee;padding-top:17px}.all[hidden]{display:none}.item{padding:13px 0;border-bottom:1px solid #f2f2f2;font-size:14px;color:#555}.item span{display:block;font-size:11px;color:#aaa;margin-top:5px}.brand{position:fixed;top:26px;left:30px;font-size:18px;font-weight:650;letter-spacing:-.04em;color:#555}.language{position:fixed;top:23px;right:28px;display:flex;align-items:center;gap:4px}.language button{font-size:12px;padding:8px 11px;border:0;color:#aaa}.language button[aria-pressed="true"]{background:#f3f3f3;color:#444}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){main{align-items:center;padding:40px 24px}h1{letter-spacing:-.055em}.actions{gap:8px}button{padding:10px 13px}}
</style>
</head>
<body>
<div class="brand">WhatDay</div><nav class="language" aria-label="Language"><button id="de" type="button" aria-pressed="false">DE</button><button id="en" type="button" aria-pressed="true">EN</button></nav>
<main><div class="wrap"><div class="eyebrow" id="weekday">TODAY</div><h1 id="date">Loading…</h1><div class="year" id="year"></div><div class="line"></div><div class="eyebrow" id="celebrate">TODAY WE CELEBRATE</div><div class="feature" id="feature">Finding something special</div></div></main>
<script>
let holidays=[];
let language=localStorage.getItem('whatday-language')==='de'?'de':'en';
const translations={
 'International Adjust your Chair Day':'Internationaler Tag der richtigen Stuhleinstellung',
 'International Adjust Your Chair Day':'Internationaler Tag der richtigen Stuhleinstellung',
 'Halloween':'Halloween',
 "New Year's Day (Secular/Global)":'Neujahr',
 'World Day of Peace':'Weltfriedenstag',
 'World Braille Day (UN)':'Welt-Braille-Tag',
 'National Doughnut Day':'Nationaler Donut-Tag',
 'World Emoji Day':'Welt-Emoji-Tag',
 'International Cat Day':'Internationaler Katzentag',
 'National Pizza Day':'Nationaler Pizza-Tag'
};
function holidayName(name){
 if(language==='en')return name;
 if(translations[name])return translations[name];
 return name.replace(/^World (.+) Day$/,'Welttag: $1')
  .replace(/^International (.+) Day$/,'Internationaler Tag: $1')
  .replace(/^National (.+) Day$/,'Nationaler Tag: $1');
}
function setLanguage(lang){
 language=lang;
 localStorage.setItem('whatday-language',lang);
 document.documentElement.lang=lang;
 for(const code of ['de','en'])el(code).setAttribute('aria-pressed',String(code===lang));
 render();
}

const el=id=>document.getElementById(id);
const berlinDate=()=>{const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return new Date(Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day),12));};
const key=d=>String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
function rank(h){let score=0,c=h.category||'';if(/^(world|international|national)\b/i.test(h.name))score+=5;if(c==='Secular/Cultural')score+=4;if(c==='UN/International')score+=3;if(/day\b/i.test(h.name))score+=1;if(/^(feast|st\.|saint|roman)/i.test(h.name))score-=8;if(/\(.*(movable|~|every \d|third|first|second|last).*\)/i.test(h.name))score-=5;return score}
function render(){
  const d=berlinDate();
  el('weekday').textContent=d.toLocaleDateString(language==='de'?'de-DE':'en-US',{timeZone:'UTC',weekday:'long'});
  el('date').textContent=d.toLocaleDateString(language==='de'?'de-DE':'en-US',{timeZone:'UTC',month:'long',day:'numeric'});
  el('year').textContent=d.getUTCFullYear();
  el('celebrate').textContent=language==='de'?'HEUTE FEIERN WIR':'TODAY WE CELEBRATE';
  const items=holidays.filter(h=>h.date===key(d)).sort((a,b)=>rank(b)-rank(a));
  el('feature').textContent=items[0]?holidayName(items[0].name):(language==='de'?'Ein Tag zum Feiern':'A day worth celebrating');
}
fetch('./holidays.json')
  .then(r=>{if(!r.ok)throw Error('File not found');return r.json()})
  .then(data=>{if(!Array.isArray(data))throw Error('Invalid data');holidays=data;render()})
  .catch(()=>{el('feature').textContent=language==='de'?'holidays.json konnte nicht geladen werden':'Could not load holidays.json';});
el('de').addEventListener('click',()=>setLanguage('de'));
el('en').addEventListener('click',()=>setLanguage('en'));
setLanguage(language);
setInterval(render,60000);
</script>
</body></html>
